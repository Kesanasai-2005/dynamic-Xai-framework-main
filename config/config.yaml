dataset:
  path: data/raw/heart.csv
  target: target

preprocessing:
  test_size: 0.2
  random_state: 42
  handle_missing: median

models:
  logistic_regression: true
  random_forest: true
  decision_tree: true

explainability:
  n_apps: 20
  top_k: 10
  n_perturbations: 2
  # Floor is raised automatically to 2 * n_features + 1 for Permutation SHAP
  shap_evals: 500
  lime_num_samples: 1000
  background_size: 100
  perturb_scale: 0.05
  # Prefer this label when present (e.g. loan "Approved"); else class index 1
  positive_class: null

hii:
  weights:
    consistency: 0.25
    stability: 0.25
    fidelity: 0.25
    feature_agreement: 0.25

evaluation:
  metrics: [accuracy, precision, recall, f1]
